name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test prerequisite
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Shell syntax
        run: bash -n bin/codex-bg && bash -n install.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show bash version
        run: /bin/bash --version | head -1
      - name: Shell syntax (system bash 3.2)
        # macOS ships Bash 3.2; keep the launcher free of Bash 4-only features.
        run: /bin/bash -n bin/codex-bg && /bin/bash -n install.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Live launchd smoke (stub codex)
        run: python3 -m unittest tests.test_macos.MacosLiveLaunchdTests -v
